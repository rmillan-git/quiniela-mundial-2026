<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>My Predictions – Quiniela 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css?v=20260628" rel="stylesheet">
</head>
<body>
  <div class="sticky-top">
    <nav class="navbar navbar-dark bg-success">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">⚽ Quiniela Mundial 2026</a>
        <div class="d-flex gap-2 flex-wrap align-items-center">
          <span class="text-white-50 small wc-countdown"></span>
          <a href="groups.html" class="btn btn-outline-light btn-sm" data-i18n="nav.groups">Grupos</a>
          <a href="bracket.html" class="btn btn-outline-light btn-sm" data-i18n="nav.bracket">Bracket</a>
          <a href="index.html" class="btn btn-outline-light btn-sm" data-i18n="nav.leaderboard">Posiciones</a>
          <a href="all-predictions.html" class="btn btn-outline-light btn-sm" data-i18n="nav.allpreds">Todas las Quinielas</a>
          <a href="register.html" class="btn btn-light btn-sm" id="nav-login" data-i18n="nav.login">Login / Registro</a>
          <a href="admin.html" class="btn btn-warning btn-sm d-none" id="nav-admin" data-i18n="nav.admin">Admin</a>
          <button class="btn btn-outline-light btn-sm d-none" id="btn-logout" data-i18n="nav.logout">Salir</button>
          <button class="btn btn-outline-light btn-sm lang-btn">🇺🇸 EN</button>
        </div>
      </div>
    </nav>
    <!-- Save bar — only visible when logged in -->
    <div id="save-bar" class="d-none bg-white border-bottom shadow-sm px-3 py-2 d-flex align-items-center gap-3">
      <button class="btn btn-success btn-sm" id="btn-save" data-i18n="pred.save">💾 Guardar Predicciones</button>
      <span id="save-status" class="text-muted small"></span>
      <div id="save-alert" class="mb-0 d-none alert py-1 px-2 small flex-grow-1"></div>
    </div>
  </div>

  <div class="container py-4">
    <h2 class="mb-1" data-i18n="pred.title">Mis Predicciones</h2>
    <p class="text-muted small">
      <span data-i18n="pred.sub">Se bloquean al inicio de cada partido</span> &nbsp;|&nbsp;
      <span class="badge bg-success">9 pts</span> <span data-i18n="pred.exact">marcador exacto</span> &nbsp;
      <span class="badge bg-primary">7 pts</span> <span data-i18n="pred.outcome">resultado correcto</span> &nbsp;
      <span class="badge bg-secondary">0 pts</span> <span data-i18n="pred.wrong">incorrecto</span>
    </p>

    <div id="auth-required" class="alert alert-warning d-none">
      <span data-i18n="pred.login_required">Inicia sesión para enviar predicciones.</span>
      <a href="register.html" data-i18n="nav.login">Login / Registro</a>
    </div>

    <div id="predictions-loading" class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
    </div>

    <div id="predictions-content" class="d-none">
      <ul class="nav nav-tabs mb-3" id="round-tabs"></ul>
      <div id="matches-container" class="tab-content"></div>
    </div>
  </div>

  <script src="js/i18n.js?v=20260628"></script>
  <script src="js/api.js?v=20260628"></script>
  <script src="js/auth.js?v=20260628"></script>
  <script>
    function toLocalTime(utcStr) {
      const d = new Date(utcStr);
      // Show user's local time with timezone abbreviation
      const local = d.toLocaleString([], {
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        timeZoneName: "short"
      });
      // Also show CST for reference
      const cst = d.toLocaleString("en-US", {
        timeZone: "America/Chicago",
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        hour12: true
      });
      return `${local} <span class="text-muted">(${cst} CST)</span>`;
    }

    // KO predictions close Jun 29 noon CDT (17:00 UTC); individual matches also lock at kickoff
    const KO_DEADLINE = new Date("2026-06-29T17:00:00Z");
    const KO_ROUNDS_SET = new Set(['round_of_32','round_of_16','qf','sf','final']);

    function isLocked(kickoffUtc, round) {
      const now = new Date();
      if (kickoffUtc && now >= new Date(kickoffUtc)) return true;
      if (KO_ROUNDS_SET.has(round) && now >= KO_DEADLINE) return true;
      return false;
    }

    function validateScore(val) {
      const n = parseInt(val, 10);
      return !isNaN(n) && n >= 0 && n <= 20 && String(n) === String(val).trim();
    }

    async function load() {
      const user = await auth.getUser();
      if (!user) {
        document.getElementById("predictions-loading").classList.add("d-none");
        document.getElementById("auth-required").classList.remove("d-none");
        return;
      }

      const [matches, myPreds] = await Promise.all([
        api.get("/matches/"),
        api.get("/predictions/my"),
      ]);

      allMatches = matches;
      const predMap = {};
      myPreds.forEach(p => {
        predMap[p.match_id] = p;
        // Restore saved pen selections
        if (p.predicted_winner_side) penSelections[p.match_id] = p.predicted_winner_side;
      });

      // Build lookup: match_number → short team label for bracket context
      const numToLabel = {};
      matches.forEach(m => {
        const hTBD = !m.home_flag || m.home_flag === "🏳️";
        const aTBD = !m.away_flag || m.away_flag === "🏳️";
        const h = hTBD ? m.home_team : `${m.home_flag} ${m.home_team}`;
        const a = aTBD ? m.away_team : `${m.away_flag} ${m.away_team}`;
        numToLabel[m.match_number] = `${h} vs ${a}`;
      });

      enrichTeam = function(name) {
        if (!name) return name || "TBD";
        const m = name.match(/P(\d{2,3})/);
        if (!m) return name;
        const ref = parseInt(m[1]);
        return numToLabel[ref] ? `${name} <span class="text-muted small">(${numToLabel[ref]})</span>` : name;
      };

      document.getElementById("predictions-loading").classList.add("d-none");
      document.getElementById("predictions-content").classList.remove("d-none");
      document.getElementById("save-bar").classList.remove("d-none");

      const rounds = ["group_stage", "round_of_32", "round_of_16", "qf", "sf", "final"];

      const tabsEl = document.getElementById("round-tabs");
      const containerEl = document.getElementById("matches-container");
      let firstActive = true;

      // Store group matches for live standings
      groupMatchesMap = {};
      matches.filter(m => m.round === "group_stage").forEach(m => {
        if (!groupMatchesMap[m.group]) groupMatchesMap[m.group] = [];
        groupMatchesMap[m.group].push(m);
      });

      rounds.forEach(round => {
        const roundMatches = matches.filter(m => m.round === round);
        if (!roundMatches.length) return;

        const label = t(`pred.round.${round}`);
        const active = firstActive ? "active" : "";
        firstActive = false;
        tabsEl.innerHTML += `<li class="nav-item"><a class="nav-link ${active}" data-bs-toggle="tab" href="#tab-${round}">${label}</a></li>`;

        let html = `<div class="tab-pane fade ${active ? "show active" : ""}" id="tab-${round}">`;

        if (round === "group_stage") {
          const groups = [...new Set(roundMatches.map(m => m.group))].sort();
          for (let i = 0; i < groups.length; i += 2) {
            html += '<div class="row g-3 mb-2">';
            for (let j = i; j < Math.min(i + 2, groups.length); j++) {
              const g = groups[j];
              html += '<div class="col-md-6">';
              html += `<h5 class="mt-2 mb-2 text-success">${window.LANG === "en" ? "Group" : "Grupo"} ${g}</h5>`;
              html += '<div class="d-flex gap-2 align-items-start">';
              html += '<div style="min-width:0;flex:1">';
              roundMatches.filter(m => m.group === g).forEach(m => html += matchCard(m, predMap));
              html += '</div>';
              html += `<div id="grp-standing-${g}" class="flex-shrink-0" style="width:175px"></div>`;
              html += '</div>';
              html += '</div>';
            }
            html += '</div>';
          }
        } else {
          const isTBD = roundMatches.every(m => !m.home_flag || m.home_flag === "🏳️");
          if (isTBD) {
            html += `<div class="alert alert-info py-2 small mb-3">
              ${window.LANG === "en"
                ? "⏳ Teams will be confirmed once previous round results are known. You can already enter your predictions!"
                : "⏳ Los equipos se confirmarán cuando terminen los resultados de la ronda anterior. ¡Ya puedes ingresar tus predicciones!"}
            </div>`;
          }
          roundMatches.forEach(m => {
            try {
              html += matchCard(m, predMap);
            } catch(err) {
              console.error("matchCard error match #" + m.match_number, err);
            }
          });
        }
        html += "</div>";
        containerEl.innerHTML += html;
      });

      // Render initial standings
      Object.keys(groupMatchesMap).forEach(g => renderGroupStandings(g, groupMatchesMap[g]));

      // Apply initial cascade for KO rounds
      applyKOCascade(allMatches, predMap);

      // Penalty winner button handler
      containerEl.addEventListener("click", e => {
        const btn = e.target.closest(".pen-btn");
        if (!btn) return;
        const mid = +btn.dataset.match;
        const side = btn.dataset.side;
        penSelections[mid] = side;
        // Toggle active style on both buttons
        const other = side === 'home' ? 'away' : 'home';
        const thisBtn = document.getElementById(`pen-${side}-${mid}`);
        const otherBtn = document.getElementById(`pen-${other}-${mid}`);
        if (thisBtn) { thisBtn.classList.replace('btn-outline-warning', 'btn-warning'); }
        if (otherBtn) { otherBtn.classList.replace('btn-warning', 'btn-outline-warning'); }
        // Update cascade
        applyKOCascade(allMatches, predMap);
      });

      // Live update as user types
      containerEl.addEventListener("input", e => {
        if (!e.target.classList.contains("pred-input")) return;
        const mid = parseInt(e.target.dataset.match);
        const m = matches.find(mx => mx.id === mid);
        if (!m) return;
        if (m.round === "group_stage") {
          renderGroupStandings(m.group, groupMatchesMap[m.group]);
        } else {
          // KO match: show/hide penalty section + update cascade
          const hEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="home"]`);
          const aEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="away"]`);
          const ph = hEl ? hEl.value : '';
          const pa = aEl ? aEl.value : '';
          const penSec = document.getElementById(`pen-section-${m.id}`);
          if (penSec) {
            const tied = ph !== '' && pa !== '' && +ph === +pa;
            penSec.classList.toggle('d-none', !tied);
          }
          applyKOCascade(allMatches, predMap);
        }
      });
    }

    let groupMatchesMap = {};

    function calcGroupStandings(groupMatches) {
      const teams = {};
      groupMatches.forEach(m => {
        [["home_team","home_flag","home"],["away_team","away_flag","away"]].forEach(([tk,fk]) => {
          if (!teams[m[tk]]) teams[m[tk]] = { name: m[tk], flag: m[fk], p:0,w:0,d:0,l:0,gf:0,ga:0 };
        });
        const hEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="home"]`);
        const aEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="away"]`);
        const h = hEl ? parseInt(hEl.value) : NaN;
        const a = aEl ? parseInt(aEl.value) : NaN;
        if (isNaN(h) || isNaN(a) || h < 0 || a < 0) return;
        const ht = teams[m.home_team], at = teams[m.away_team];
        ht.p++; at.p++; ht.gf += h; ht.ga += a; at.gf += a; at.ga += h;
        if (h > a)      { ht.w++; at.l++; }
        else if (h < a) { at.w++; ht.l++; }
        else            { ht.d++; at.d++; }
      });
      return Object.values(teams)
        .map(t => ({ ...t, gd: t.gf - t.ga, pts: t.w * 3 + t.d }))
        .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
    }

    function renderGroupStandings(g, groupMatches) {
      const el = document.getElementById(`grp-standing-${g}`);
      if (!el) return;
      const sorted = calcGroupStandings(groupMatches);
      if (!sorted.some(t => t.p > 0)) { el.innerHTML = ""; return; }

      const lbl = window.LANG === "en" ? "📊 Projected" : "📊 Proyectado";
      let html = `<p class="text-muted mb-1 fst-italic" style="font-size:.7rem">${lbl}</p>
        <table class="table table-bordered mb-0" style="font-size:.72rem">
        <thead class="table-light"><tr>
          <th>${t("groups.col_team")}</th>
          <th class="text-center px-1">${t("groups.col_won")}</th>
          <th class="text-center px-1">${t("groups.col_drawn")}</th>
          <th class="text-center px-1">${t("groups.col_lost")}</th>
          <th class="text-center px-1">${t("groups.col_pts")}</th>
        </tr></thead><tbody>`;
      sorted.forEach((tm, i) => {
        const cls = i < 2 ? "table-success" : (i === 2 ? "table-warning" : "");
        const flag = tm.flag && tm.flag !== "🏳️" ? tm.flag : "";
        const name = tm.name.length > 9 ? tm.name.slice(0, 9) + "…" : tm.name;
        html += `<tr class="${cls}" title="${tm.name} — ${tm.gf}:${tm.ga} (DG ${tm.gd > 0 ? "+" : ""}${tm.gd})">
          <td class="px-1">${flag} ${name}</td>
          <td class="text-center px-1">${tm.w}</td>
          <td class="text-center px-1">${tm.d}</td>
          <td class="text-center px-1">${tm.l}</td>
          <td class="text-center px-1 fw-bold">${tm.pts}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      el.innerHTML = html;
    }

    // Re-render standings on language change
    document.addEventListener("langchange", () => {
      Object.keys(groupMatchesMap).forEach(g => renderGroupStandings(g, groupMatchesMap[g]));
    });

    // ── Knockout bracket cascade map (match_number → which match/side it feeds) ─
    // R32→R16: confirmed from official FIFA 2026 bracket
    // M74+M77→M89, M73+M75→M90, M76+M78→M91, M79+M80→M92
    const BRACKET_FEEDS = {
      74:{to:89,side:'home'},  77:{to:89,side:'away'},
      73:{to:90,side:'home'},  75:{to:90,side:'away'},
      76:{to:91,side:'home'},  78:{to:91,side:'away'},
      79:{to:92,side:'home'},  80:{to:92,side:'away'},
      81:{to:93,side:'home'},  82:{to:93,side:'away'},
      83:{to:94,side:'home'},  84:{to:94,side:'away'},
      85:{to:95,side:'home'},  86:{to:95,side:'away'},
      87:{to:96,side:'home'},  88:{to:96,side:'away'},
      89:{to:97,side:'home'},  90:{to:97,side:'away'},
      91:{to:98,side:'home'},  92:{to:98,side:'away'},
      93:{to:99,side:'home'},  94:{to:99,side:'away'},
      95:{to:100,side:'home'}, 96:{to:100,side:'away'},
      97:{to:101,side:'home'}, 98:{to:101,side:'away'},
      99:{to:102,side:'home'}, 100:{to:102,side:'away'},
      101:{to:104,side:'home'},102:{to:104,side:'away'},
    };

    // penSelections: {matchId: "home"|"away"|null} — penalty winner picks
    let penSelections = {};
    let allMatches = [];

    // Build cascade context: which team is playing home/away in each KO match
    function buildCascadeCtx(matches, predMap) {
      const matchByNum = {};
      matches.forEach(m => matchByNum[m.match_number] = m);
      const winnerOf = {};  // matchNum → {name, flag}
      const ctx = {};       // "matchNum_home" / "matchNum_away" → {name, flag}

      const KO_ROUNDS = ['round_of_32','round_of_16','qf','sf','final'];
      const koMatches = matches.filter(m => KO_ROUNDS.includes(m.round))
        .sort((a, b) => a.match_number - b.match_number);

      for (const m of koMatches) {
        // Resolve home team
        let homeTeam = null, awayTeam = null;
        if (m.home_flag && m.home_flag !== '🏳️') {
          homeTeam = {name: m.home_team, flag: m.home_flag};
        } else {
          for (const [num, feed] of Object.entries(BRACKET_FEEDS)) {
            if (feed.to === m.match_number && feed.side === 'home') {
              homeTeam = winnerOf[+num] || null; break;
            }
          }
        }
        if (m.away_flag && m.away_flag !== '🏳️') {
          awayTeam = {name: m.away_team, flag: m.away_flag};
        } else {
          for (const [num, feed] of Object.entries(BRACKET_FEEDS)) {
            if (feed.to === m.match_number && feed.side === 'away') {
              awayTeam = winnerOf[+num] || null; break;
            }
          }
        }
        if (homeTeam) ctx[`${m.match_number}_home`] = homeTeam;
        if (awayTeam) ctx[`${m.match_number}_away`] = awayTeam;

        // Determine winner (actual or predicted)
        let winner = null;
        if (m.is_finished && m.home_score != null) {
          if (m.home_score > m.away_score) winner = homeTeam;
          else if (m.away_score > m.home_score) winner = awayTeam;
          // penalty winner: use winner_id from API if available
          else if (m.winner_id) {
            winner = m.winner_id === m.home_team_id ? homeTeam : awayTeam;
          }
        } else {
          const pred = predMap[m.id];
          const hEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="home"]`);
          const aEl = document.querySelector(`.pred-input[data-match="${m.id}"][data-side="away"]`);
          const ph = hEl && hEl.value !== '' ? +hEl.value : (pred ? pred.home_score : null);
          const pa = aEl && aEl.value !== '' ? +aEl.value : (pred ? pred.away_score : null);
          if (ph != null && pa != null && !isNaN(ph) && !isNaN(pa)) {
            if (ph > pa) winner = homeTeam;
            else if (pa > ph) winner = awayTeam;
            else {
              const pws = penSelections[m.id] ?? (pred ? pred.predicted_winner_side : null);
              if (pws === 'home') winner = homeTeam;
              else if (pws === 'away') winner = awayTeam;
            }
          }
        }
        winnerOf[m.match_number] = winner;
      }
      return ctx;
    }

    // Update all team labels + penalty buttons in knockout cards from cascade context
    function applyKOCascade(matches, predMap) {
      const ctx = buildCascadeCtx(matches, predMap);
      const KO_ROUNDS = ['round_of_32','round_of_16','qf','sf','final'];
      matches.filter(m => KO_ROUNDS.includes(m.round)).forEach(m => {
        const hCtx = ctx[`${m.match_number}_home`];
        const aCtx = ctx[`${m.match_number}_away`];
        const hEl = document.getElementById(`ko-home-${m.id}`);
        const aEl = document.getElementById(`ko-away-${m.id}`);
        if (hEl && hCtx) {
          const hph = m.home_team_placeholder ? ` <span class="text-muted small fw-normal">(${m.home_team_placeholder})</span>` : '';
          hEl.innerHTML = `${hCtx.flag} ${hCtx.name}${hph}`;
        }
        if (aEl && aCtx) {
          const aph = m.away_team_placeholder ? ` <span class="text-muted small fw-normal">(${m.away_team_placeholder})</span>` : '';
          aEl.innerHTML = `${aCtx.name} ${aCtx.flag}${aph}`;
        }
        // Update pen buttons
        const phBtn = document.getElementById(`pen-home-${m.id}`);
        const paBtn = document.getElementById(`pen-away-${m.id}`);
        if (phBtn && hCtx) phBtn.dataset.label = `${hCtx.flag} ${hCtx.name}`;
        if (paBtn && aCtx) paBtn.dataset.label = `${aCtx.name} ${aCtx.flag}`;
        // Update pen button visible text
        if (phBtn) phBtn.innerHTML = hCtx ? `${hCtx.flag} ${hCtx.name.split(' ')[0]}` : phBtn.innerHTML;
        if (paBtn) paBtn.innerHTML = aCtx ? `${aCtx.name.split(' ')[0]} ${aCtx.flag}` : paBtn.innerHTML;
      });
    }

    let enrichTeam = name => name; // overridden after matches load

    function teamLabel(flag, name, placeholder) {
      const safeName = name || "TBD";
      if (flag && flag !== "🏳️") {
        const ph = placeholder ? ` <span class="text-muted small fw-normal">(${placeholder})</span>` : '';
        return `${flag} ${safeName}${ph}`;
      }
      return `<span class="text-muted fst-italic">${enrichTeam(safeName)}</span>`;
    }

    function matchCard(m, predMap) {
      const isKO = m.round !== 'group_stage';
      const locked = isLocked(m.kickoff_utc, m.round);
      const pred = predMap[m.id] || {};
      const ph = pred.home_score ?? "";
      const pa = pred.away_score ?? "";
      const pws = pred.predicted_winner_side || null;

      const scoreDisplay = m.is_finished
        ? `<span class="badge bg-secondary ms-1">${m.home_score}–${m.away_score}${m.winner_name ? ` (pen: ${m.winner_flag}${m.winner_name})` : ""}</span>` : "";
      const pts = pred.points != null
        ? `<span class="badge ${pred.points===9?"bg-success":pred.points===7?"bg-primary":"bg-secondary"} ms-1">${pred.points}pts</span>` : "";

      // For KO matches: team labels have IDs so cascade can update them
      const homeSpan = isKO
        ? `<span id="ko-home-${m.id}" class="fw-semibold">${teamLabel(m.home_flag, m.home_team, m.home_team_placeholder)}</span>`
        : `<span class="fw-semibold">${teamLabel(m.home_flag, m.home_team)}</span>`;
      const awaySpan = isKO
        ? `<span id="ko-away-${m.id}" class="fw-semibold">${teamLabel(m.away_flag, m.away_team, m.away_team_placeholder)}</span>`
        : `<span class="fw-semibold">${teamLabel(m.away_flag, m.away_team)}</span>`;

      // Penalty winner picker (KO only, shown when predicted scores are tied)
      const isTie = ph !== "" && pa !== "" && +ph === +pa;
      const penSection = (isKO && !locked) ? `
        <div id="pen-section-${m.id}" class="mt-2 d-flex align-items-center gap-2 flex-wrap${isTie ? '' : ' d-none'}">
          <span class="small fw-semibold text-warning">🏆 ¿Quién avanza en penales?</span>
          <div class="btn-group btn-group-sm">
            <button type="button" id="pen-home-${m.id}"
              class="btn ${pws==='home'?'btn-warning':'btn-outline-warning'} pen-btn"
              data-match="${m.id}" data-side="home">
              ${m.home_flag && m.home_flag!=='🏳️' ? m.home_flag+' '+(m.home_team||'TBD').split(' ')[0] : (m.home_team||'TBD').split(' ')[0]}
            </button>
            <button type="button" id="pen-away-${m.id}"
              class="btn ${pws==='away'?'btn-warning':'btn-outline-warning'} pen-btn"
              data-match="${m.id}" data-side="away">
              ${m.away_flag && m.away_flag!=='🏳️' ? (m.away_team||'TBD').split(' ')[0]+' '+m.away_flag : (m.away_team||'TBD').split(' ')[0]}
            </button>
          </div>
        </div>` : '';

      return `
        <div class="card mb-2 ${locked ? "border-secondary opacity-75" : "border-success border-opacity-25"}">
          <div class="card-body py-2 px-3">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="text-muted small">#${m.match_number}</span>
              ${homeSpan}
              <input type="number" min="0" max="20" step="1"
                class="form-control form-control-sm pred-input text-center ${locked?"":"border-success"}"
                data-match="${m.id}" data-side="home" data-ko="${isKO?1:0}"
                value="${ph}" ${locked ? "disabled" : "required"} style="width:62px"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')">
              <span class="fw-bold">–</span>
              <input type="number" min="0" max="20" step="1"
                class="form-control form-control-sm pred-input text-center ${locked?"":"border-success"}"
                data-match="${m.id}" data-side="away" data-ko="${isKO?1:0}"
                value="${pa}" ${locked ? "disabled" : "required"} style="width:62px"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')">
              ${awaySpan}
              ${scoreDisplay}${pts}
            </div>
            ${penSection}
            <div class="d-flex justify-content-between align-items-center mt-1 flex-wrap gap-1">
              <span class="text-muted small">📍 ${m.venue || ""}</span>
              <span class="small">${toLocalTime(m.kickoff_utc)}</span>
              ${locked ? `<span class="badge bg-secondary">${t("pred.locked")}</span>` : ""}
            </div>
          </div>
        </div>`;
    }

    document.getElementById("btn-save").addEventListener("click", async () => {
      const inputs = document.querySelectorAll(".pred-input:not([disabled])");
      const matchPreds = {};

      inputs.forEach(inp => {
        const mid = inp.dataset.match;
        matchPreds[mid] = matchPreds[mid] || {};
        const val = inp.value.trim();
        if (val === "") {
          inp.classList.remove("is-invalid");
        } else if (!validateScore(val)) {
          inp.classList.add("is-invalid");
          matchPreds[mid]._invalid = true;
        } else {
          inp.classList.remove("is-invalid");
          matchPreds[mid][inp.dataset.side] = parseInt(val, 10);
          if (inp.dataset.ko === "1") matchPreds[mid]._ko = true;
        }
      });

      const hasInvalid = Object.values(matchPreds).some(m => m._invalid);
      const alertEl = document.getElementById("save-alert");
      if (hasInvalid) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = t("pred.invalid");
        alertEl.classList.remove("d-none");
        return;
      }

      const status = document.getElementById("save-status");
      status.textContent = t("pred.saving");
      alertEl.className = "alert d-none";
      let saved = 0, errors = 0;

      for (const [mid, scores] of Object.entries(matchPreds)) {
        if (scores.home == null || scores.away == null) continue;
        const body = { home_score: scores.home, away_score: scores.away };
        // Include penalty winner for knockout draws
        if (scores._ko && scores.home === scores.away) {
          body.predicted_winner_side = penSelections[mid] || null;
        }
        const res = await api.put(`/predictions/${mid}`, body);
        res.ok ? saved++ : errors++;
      }

      alertEl.className = `alert ${errors ? "alert-warning" : "alert-success"}`;
      alertEl.textContent = errors
        ? `${saved} ${t("pred.saved_ok")} — ${t("pred.saved_err")} ${errors}.`
        : `✅ ${saved} ${t("pred.saved_ok")}`;
      alertEl.classList.remove("d-none");
      status.textContent = "";
    });

    load();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
